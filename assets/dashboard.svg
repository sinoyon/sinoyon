<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Sample animated business intelligence dashboard">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c4dff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <clipPath id="r"><rect width="1000" height="440" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="'Segoe UI',Inter,Arial,sans-serif">
    <rect width="1000" height="440" fill="#0b1020"/>
    <rect width="1000" height="44" fill="#121a38"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="46" cy="22" r="6" fill="#ffbd2e"/><circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <text x="500" y="27" text-anchor="middle" font-size="14" fill="#9fb3ff">Sales Performance Dashboard · sample data</text>
    <g transform="translate(930 22)"><circle r="5" fill="#27c93f"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="12" y="5" font-size="12" fill="#9fb3ff">LIVE</text></g>

    <!-- KPI tiles -->
    <g font-size="12" fill="#7d88b8">
      <g transform="translate(24 64)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin=".2s" fill="freeze"/><rect width="222" height="78" rx="12" fill="#121a38"/><text x="16" y="26">Revenue</text><text x="16" y="58" font-size="26" font-weight="700" fill="#e8ecff">$1.24M</text><text x="150" y="58" font-size="13" fill="#27c93f">▲ 12.4%</text></g>
      <g transform="translate(262 64)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin=".4s" fill="freeze"/><rect width="222" height="78" rx="12" fill="#121a38"/><text x="16" y="26">Orders</text><text x="16" y="58" font-size="26" font-weight="700" fill="#e8ecff">8,420</text><text x="150" y="58" font-size="13" fill="#27c93f">▲ 7.1%</text></g>
      <g transform="translate(500 64)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin=".6s" fill="freeze"/><rect width="222" height="78" rx="12" fill="#121a38"/><text x="16" y="26">Avg. Order Value</text><text x="16" y="58" font-size="26" font-weight="700" fill="#e8ecff">$147</text><text x="150" y="58" font-size="13" fill="#ff4081">▼ 1.9%</text></g>
      <g transform="translate(738 64)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin=".8s" fill="freeze"/><rect width="238" height="78" rx="12" fill="#121a38"/><text x="16" y="26">Conversion</text><text x="16" y="58" font-size="26" font-weight="700" fill="#e8ecff">3.8%</text><text x="150" y="58" font-size="13" fill="#27c93f">▲ 0.6%</text></g>
    </g>

    <!-- area / line chart -->
    <g transform="translate(24 158)">
      <rect width="460" height="258" rx="12" fill="#121a38"/>
      <text x="16" y="28" font-size="13" fill="#9fb3ff">Revenue trend</text>
      <g stroke="#ffffff" stroke-opacity=".07"><path d="M16 70H444M16 115H444M16 160H444M16 205H444"/></g>
      <path d="M16 200 C60 190,90 140,130 150 S200 100,240 120 S320 60,360 80 S420 40,444 50 V225 H16Z" fill="url(#ar)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.5;.9;1" dur="7s" repeatCount="indefinite"/></path>
      <path d="M16 200 C60 190,90 140,130 150 S200 100,240 120 S320 60,360 80 S420 40,444 50" fill="none" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="620"><animate attributeName="stroke-dashoffset" values="620;0;0;620" keyTimes="0;.45;.9;1" dur="7s" repeatCount="indefinite"/></path>
      <circle r="6" fill="#fff"><animateMotion dur="7s" repeatCount="indefinite" path="M16 200 C60 190,90 140,130 150 S200 100,240 120 S320 60,360 80 S420 40,444 50" keyPoints="0;1;1;0" keyTimes="0;.45;.9;1" calcMode="linear"/></circle>
      <g font-size="11" fill="#7d88b8" text-anchor="middle"><text x="16" y="245">Jan</text><text x="130" y="245">Mar</text><text x="240" y="245">May</text><text x="360" y="245">Jul</text><text x="444" y="245">Sep</text></g>
    </g>

    <!-- bar chart -->
    <g transform="translate(500 158)">
      <rect width="260" height="258" rx="12" fill="#121a38"/>
      <text x="16" y="28" font-size="13" fill="#9fb3ff">Sales by region</text>
      <g fill="url(#bar)">
        <rect x="24"  y="215" width="30" height="0" rx="5"><animate attributeName="height" values="0;150;150;0" keyTimes="0;.3;.9;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="215;65;65;215" keyTimes="0;.3;.9;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="74"  y="215" width="30" height="0" rx="5"><animate attributeName="height" values="0;110;110;0" keyTimes="0;.35;.9;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="215;105;105;215" keyTimes="0;.35;.9;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="124" y="215" width="30" height="0" rx="5"><animate attributeName="height" values="0;130;130;0" keyTimes="0;.4;.9;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="215;85;85;215" keyTimes="0;.4;.9;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="174" y="215" width="30" height="0" rx="5"><animate attributeName="height" values="0;80;80;0" keyTimes="0;.45;.9;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="215;135;135;215" keyTimes="0;.45;.9;1" dur="6s" repeatCount="indefinite"/></rect>
      </g>
      <g font-size="11" fill="#7d88b8" text-anchor="middle"><text x="39" y="237">North</text><text x="89" y="237">South</text><text x="139" y="237">East</text><text x="189" y="237">West</text></g>
    </g>

    <!-- donut -->
    <g transform="translate(776 158)">
      <rect width="200" height="258" rx="12" fill="#121a38"/>
      <text x="16" y="28" font-size="13" fill="#9fb3ff">Target achieved</text>
      <g transform="translate(100 135) rotate(-90)" fill="none" stroke-width="16" stroke-linecap="round">
        <circle r="56" stroke="#243056"/>
        <circle r="56" stroke="url(#ac)" stroke-dasharray="352" stroke-dashoffset="352"><animate attributeName="stroke-dashoffset" values="352;78;78;352" keyTimes="0;.4;.9;1" dur="6s" repeatCount="indefinite"/></circle>
      </g>
      <text x="100" y="143" text-anchor="middle" font-size="28" font-weight="700" fill="#e8ecff">78%</text>
      <text x="100" y="232" text-anchor="middle" font-size="11" fill="#7d88b8">of Q3 goal</text>
    </g>
  </g>
</svg>
