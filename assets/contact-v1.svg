<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Let's work together. Open to AI, data and full-stack opportunities.">
  <defs>
    <radialGradient id="gl" cx=".5" cy="1.1" r=".8">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".16"><animate attributeName="stop-opacity" values=".10;.2;.10" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ln" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="999" height="189" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x=".5" y=".5" width="999" height="189" rx="16" fill="url(#gl)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".8s" begin=".1s" fill="freeze"/>
      <circle cx="358" cy="46" r="4" fill="#3fb950"/>
      <circle cx="358" cy="46" r="4" fill="none" stroke="#3fb950"><animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle>
      <text x="500" y="51" font-size="14" fill="#8b949e" letter-spacing="2">OPEN TO NEW OPPORTUNITIES</text>
    </g>
    <text x="500" y="102" font-size="36" font-weight="700" fill="#e6edf3" opacity="0">Let's work together
      <animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".3s" fill="freeze"/>
      <animate attributeName="y" from="112" to="102" dur=".9s" begin=".3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/>
    </text>
    <rect x="470" y="118" width="0" height="3" rx="1.5" fill="url(#ln)"><animate attributeName="width" from="0" to="60" dur=".8s" begin=".9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/></rect>
    <text x="500" y="154" font-size="16" fill="#8b949e" opacity="0">Have a project or a role in AI, data or software? I'd be glad to talk.
      <animate attributeName="opacity" from="0" to="1" dur=".9s" begin="1.1s" fill="freeze"/>
    </text>
  </g>
</svg>
