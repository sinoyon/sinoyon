<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="End-to-end workflow across data analytics, AI engineering and full-stack development">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff4081"/></linearGradient>
    <clipPath id="r"><rect width="1000" height="310" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="'Segoe UI',Inter,Arial,sans-serif" text-anchor="middle">
    <rect width="1000" height="310" fill="#0b1020"/>
    <text x="500" y="40" fill="url(#g)" font-size="18" font-weight="800" letter-spacing="5">ONE PERSON · THE WHOLE PIPELINE</text>
    <path d="M100 110 H900" stroke="#243056" stroke-width="3" stroke-dasharray="6 8" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/></path>
    <g fill="url(#g)">
      <circle r="6"><animateMotion dur="5s" repeatCount="indefinite" path="M100 110 H900"/></circle>
      <circle r="6"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M100 110 H900"/></circle>
      <circle r="6"><animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M100 110 H900"/></circle>
    </g>
    <g transform="translate(100 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.0s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#00e5ff" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">01</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Collect</text>
      <text y="90" font-size="12.5" fill="#7d88b8">APIs · files · databases</text></g>
    <g transform="translate(260 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.25s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#00e5ff" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">02</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Clean &amp; Analyze</text>
      <text y="90" font-size="12.5" fill="#7d88b8">SQL · Python · Excel</text></g>
    <g transform="translate(420 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.5s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#7c4dff" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">03</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Model</text>
      <text y="90" font-size="12.5" fill="#7d88b8">ML &amp; AI systems</text></g>
    <g transform="translate(580 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="0.75s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#ff4081" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">04</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Build</text>
      <text y="90" font-size="12.5" fill="#7d88b8">Web &amp; mobile apps</text></g>
    <g transform="translate(740 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.0s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#ff4081" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">05</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Visualize</text>
      <text y="90" font-size="12.5" fill="#7d88b8">Power BI dashboards</text></g>
    <g transform="translate(900 110)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.25s" fill="freeze"/>
      <circle r="34" fill="#121a38" stroke="#ff4081" stroke-width="2"><animate attributeName="r" values="34;38;34" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
      <text y="6" font-size="17" font-weight="700" fill="#e8ecff">06</text>
      <text y="68" font-size="16" font-weight="700" fill="#e8ecff">Deliver</text>
      <text y="90" font-size="12.5" fill="#7d88b8">Deploy &amp; support</text></g>
    <g><rect x="60" y="244" width="240" height="6" rx="3" fill="#00e5ff" opacity=".85"><animate attributeName="opacity" values=".35;.95;.35" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
    <text x="180" y="274" font-size="12.5" font-weight="700" letter-spacing="3" fill="#00e5ff">DATA ANALYTICS</text></g>
    <g><rect x="350" y="244" width="140" height="6" rx="3" fill="#7c4dff" opacity=".85"><animate attributeName="opacity" values=".35;.95;.35" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text x="420" y="274" font-size="12.5" font-weight="700" letter-spacing="3" fill="#7c4dff">AI ENGINEERING</text></g>
    <g><rect x="540" y="244" width="400" height="6" rx="3" fill="#ff4081" opacity=".85"><animate attributeName="opacity" values=".35;.95;.35" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
    <text x="740" y="274" font-size="12.5" font-weight="700" letter-spacing="3" fill="#ff4081">FULL-STACK &amp; BI</text></g>
  </g>
</svg>
