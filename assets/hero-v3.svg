<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="MD Shariful Islam - Data Analyst and Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff4081;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff4081"><animate attributeName="stop-color" values="#ff4081;#00e5ff;#7c4dff;#ff4081" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#7c4dff" stop-opacity=".55"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#00e5ff" stop-opacity=".45"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="r"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect x="-40" y="-40" width="1080" height="400" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="220" fill="url(#glow1)"><animate attributeName="cx" values="150;420;150" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;260;60" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="200" fill="url(#glow2)"><animate attributeName="cx" values="850;600;850" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="260;40;260" dur="9s" repeatCount="indefinite"/></circle>

    <!-- live bar chart + trend line -->
    <g transform="translate(660 60)">
      <g fill="url(#ac)" opacity=".9">
        <rect x="0"   width="26" rx="5"><animate attributeName="height" values="40;130;70;40" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="170;80;140;170" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="46"  width="26" rx="5"><animate attributeName="height" values="90;60;150;90" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="120;150;60;120" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="92"  width="26" rx="5"><animate attributeName="height" values="60;150;100;60" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="150;60;110;150" dur="4.5s" repeatCount="indefinite"/></rect>
        <rect x="138" width="26" rx="5"><animate attributeName="height" values="120;70;160;120" dur="5.5s" repeatCount="indefinite"/><animate attributeName="y" values="90;140;50;90" dur="5.5s" repeatCount="indefinite"/></rect>
        <rect x="184" width="26" rx="5"><animate attributeName="height" values="80;140;60;80" dur="4.2s" repeatCount="indefinite"/><animate attributeName="y" values="130;70;150;130" dur="4.2s" repeatCount="indefinite"/></rect>
        <rect x="230" width="26" rx="5"><animate attributeName="height" values="150;100;170;150" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="60;110;40;60" dur="6s" repeatCount="indefinite"/></rect>
      </g>
      <path d="M13 110 C 60 40, 100 130, 150 60 S 230 20, 243 10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
        <animate attributeName="stroke-dashoffset" values="400;0;0;400" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="6" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M13 110 C 60 40, 100 130, 150 60 S 230 20, 243 10" keyPoints="0;1;1;0" keyTimes="0;.5;.85;1" calcMode="linear"/></circle>
    </g>

    <g font-family="'Segoe UI',Inter,Arial,sans-serif">
      <text x="60" y="100" font-size="20" fill="#9fb3ff" letter-spacing="6" opacity="0">
        I'M
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="60" y="165" font-size="58" font-weight="800" fill="url(#ac)" opacity="0">
        MD Shariful Islam
        <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
      </text>
      <rect x="60" y="182" width="0" height="4" rx="2" fill="url(#ac)"><animate attributeName="width" values="0;330" dur="1.6s" fill="freeze" begin=".4s"/></rect>

      <!-- rotating roles -->
      <g font-size="24" fill="#e8ecff">
        <text x="60" y="238" opacity="0">Data Analyst<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.32;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="60" y="238" opacity="0">Business Intelligence Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.37;.61;.65;1" dur="12s" repeatCount="indefinite"/></text>
        <text x="60" y="238" opacity="0">Full-Stack Problem Solver<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.7;.94;1" dur="12s" repeatCount="indefinite"/></text>
      </g>
      <text x="60" y="285" font-size="15" fill="#7d88b8">Power BI · SQL · Python · Angular · Laravel — turning raw data into decisions</text>
    </g>
    <rect x="1.5" y="1.5" width="997" height="317" rx="21" fill="none" stroke="url(#ac)" stroke-width="2" stroke-dasharray="120 1200">
      <animate attributeName="stroke-dashoffset" from="0" to="-1320" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
